<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimezStudy — Classes</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" fill="none" stroke="#FFB35A" stroke-width="2"/><circle cx="13" cy="13" r="4" fill="#FFB35A"/></svg>
    </div>
    PrimezStudy
  </div>
  <div class="topbar-right">
    <a href="instructor.html" class="btn-ghost">Instructor</a>
    <div class="user-chip">
      <img id="user-avatar" src="" alt="">
      <span id="user-name">&nbsp;</span>
    </div>
    <button id="logout-btn" class="btn-ghost">Log out</button>
  </div>
</div>

<div class="page-shell">
  <div class="page-head">
    <div>
      <h1>Your classes</h1>
      <p>Live sessions only — join while they're happening.</p>
    </div>
  </div>

  <div id="live-section">
    <div class="section-label">Live now</div>
    <div id="live-grid" class="class-grid">
      <div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </div>

  <div class="section-label">Upcoming</div>
  <div id="upcoming-grid" class="class-grid">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>

  <div id="past-section">
    <div class="section-label">Recently ended</div>
    <div id="past-grid" class="class-grid"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
