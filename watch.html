<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="Watch a PrimezStudy recorded lecture with a custom learning player.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#5271DE">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PrimezStudy">
<meta property="og:title" content="Watch Lecture | PrimezStudy">
<meta property="og:description" content="Watch a PrimezStudy recorded lecture with a custom learning player.">
<meta property="og:image" content="icon.png">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://primezstudy.com/watch.html">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"EducationalOrganization","name":"PrimezStudy","description":"Watch a PrimezStudy recorded lecture with a custom learning player.","url":"https://primezstudy.com/"}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimezStudy — Watch</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/responsive.js"></script>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark"><svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="13" cy="13" r="4" fill="currentColor"/></svg></div>
    PrimezStudy
  </div>
  <div class="topbar-right">
    <a href="lectures.html" class="btn-ghost">← Lectures</a>
  </div>
</div>

<div class="player-shell">
  <div class="watch-player" id="watch-player">
    <video id="v" playsinline></video>

    <div class="wp-top-gradient"></div>
    <div class="wp-title-overlay" id="wp-title-overlay"></div>

    <div class="wp-tap-zone wp-tap-left" id="wp-tap-left"></div>
    <div class="wp-tap-zone wp-tap-right" id="wp-tap-right"></div>
    <div class="wp-skip-flash wp-skip-flash-left" id="wp-flash-left">⟲10</div>
    <div class="wp-skip-flash wp-skip-flash-right" id="wp-flash-right">10⟳</div>

    <div class="wp-spinner" id="wp-spinner"></div>
    <div class="wp-center-play" id="wp-center-play">▶</div>

    <div class="wp-controls" id="wp-controls">
      <div class="wp-progress" id="wp-progress">
        <div class="wp-progress-buffered" id="wp-buffered"></div>
        <div class="wp-progress-played" id="wp-played"></div>
        <div class="wp-progress-handle" id="wp-handle"></div>
      </div>
      <div class="wp-row">
        <button id="wp-play" class="wp-btn" title="Play/Pause">▶</button>
        <button id="wp-back" class="wp-btn" title="Back 10s">⟲10</button>
        <button id="wp-fwd" class="wp-btn" title="Forward 10s">10⟳</button>
        <span class="wp-time"><span id="wp-current">0:00</span> / <span id="wp-duration">0:00</span></span>
        <span class="wp-spacer"></span>
        <div class="wp-volume">
          <button id="wp-mute" class="wp-btn" title="Mute">🔊</button>
          <input id="wp-vol" type="range" min="0" max="1" step="0.05" value="1">
        </div>
        <select id="wp-speed" class="wp-speed" title="Playback speed">
          <option value="0.5">0.5×</option>
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
        <button id="wp-fullscreen" class="wp-btn" title="Fullscreen">⛶</button>
      </div>
    </div>
  </div>

  <div class="class-info">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
      <h2 id="lecture-title">&nbsp;</h2>
      <span id="xp-badge" class="xp-badge"></span>
    </div>
    <div class="class-meta" id="lecture-meta"></div>
    <p class="desc" id="lecture-desc"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script><script src="js/fullscreen.js"></script>
<script src="js/profile-sync.js"></script>
<script src="js/watch-player.js"></script>
</body>
</html>
